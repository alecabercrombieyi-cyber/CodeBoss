const{useState,useEffect,useMemo,useCallback,useRef}=React;

// ─── Toast Notifications ────────────────────────────────────────────
function showToast(msg,type='success',duration=3000){
  const el=document.createElement('div');el.className=`toast toast-${type}`;el.textContent=msg;
  document.body.appendChild(el);setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity 0.3s';setTimeout(()=>el.remove(),300);},duration);
}

// ─── Session Persistence ────────────────────────────────────────────
function saveSession(trucks,loads){
  try{localStorage.setItem('fm_trucks',JSON.stringify(trucks));localStorage.setItem('fm_loads',JSON.stringify(loads));}catch(e){}
}
function loadSession(){
  try{
    const t=JSON.parse(localStorage.getItem('fm_trucks')||'[]');
    const l=JSON.parse(localStorage.getItem('fm_loads')||'[]');
    return{trucks:Array.isArray(t)?t:[],loads:Array.isArray(l)?l:[]};
  }catch{return{trucks:[],loads:[]};}
}

// ─── CSV Export ─────────────────────────────────────────────────────
function exportMatchesCSV(matches,trucks,loads){
  const rows=[['Truck Location','Truck Equipment','Truck Carrier','Truck Available','Preferred Lane','Load Origin','Load Destination','Load Equipment','Load Weight','PU Date','PU Time','DEL Date','DEL Time','Distance (mi)','Lane Match']];
  Object.entries(matches).forEach(([tid,tm])=>{
    const truck=trucks.find(t=>t.id===tid);if(!truck)return;
    const lane=(truck.preferred_destinations||[]).join(' / ');
    tm.forEach(m=>{rows.push([truck.location,truck.equipment,truck.carrier||'',truck.available||'',lane,
      m.load.origin,m.load.destination,m.load.equipment,m.load.weight||'',m.load.pickup_date||'',m.load.pickup_time||'',
      m.load.delivery_date||'',m.load.delivery_time||'',m.distance,m.laneMatch?'Yes':'']);});
  });
  const csv=rows.map(r=>r.map(c=>'"'+(c+'').replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`freight-matches-${new Date().toISOString().slice(0,10)}.csv`;a.click();
  URL.revokeObjectURL(url);showToast(`Exported ${rows.length-1} matches to CSV`,'success');
}

  if(geoCache[k])return geoCache[k];
  for(const[c,co]of Object.entries(CC)){if(k===c.replace(/\./g,"")||(k.includes(c.replace(/\./g,""))&&k.length<c.length+8))return{lat:co[0],lng:co[1]};}
  const co=k.split(",")[0].trim();for(const[c,coords]of Object.entries(CC)){if(c.startsWith(co+","))return{lat:coords[0],lng:coords[1]};}
  return geoCache[k]||null;}

let nominatimBusy=false;
async function geoNominatim(location){
  if(!location)return null;
  const k=location.toLowerCase().trim().replace(/\./g,"").replace(/\s+/g," ");
  if(CC[k])return{lat:CC[k][0],lng:CC[k][1]};
  if(geoCache[k])return geoCache[k];
  const localResult=geo(location);
  if(localResult)return localResult;
  const skip=["midwest","east coast","west coast","southeast","southwest","northeast","northwest","south","north","east","west","anywhere","nationwide"];
  if(skip.some(s=>k.includes(s)))return null;
  // Wait for rate limit
  while(nominatimBusy)await new Promise(r=>setTimeout(r,200));
  nominatimBusy=true;
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(location+', USA')}&format=json&limit=1`,
      {headers:{'User-Agent':'FreightMatcher/1.0'}});
    const data=await r.json();
    if(data&&data[0]){
      const result={lat:parseFloat(data[0].lat),lng:parseFloat(data[0].lon)};
      geoCache[k]=result;return result;
    }return null;
  }catch{return null;}
  finally{setTimeout(()=>{nominatimBusy=false;},1100);}
}
function hav(a1,n1,a2,n2){const R=3959,dA=(a2-a1)*Math.PI/180,dN=(n2-n1)*Math.PI/180;
  const x=Math.sin(dA/2)**2+Math.cos(a1*Math.PI/180)*Math.cos(a2*Math.PI/180)*Math.sin(dN/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}

const SA={"Alabama":"AL","Alaska":"AK","Arizona":"AZ","Arkansas":"AR","California":"CA","Colorado":"CO","Connecticut":"CT","Delaware":"DE","Florida":"FL","Georgia":"GA","Hawaii":"HI","Idaho":"ID","Illinois":"IL","Indiana":"IN","Iowa":"IA","Kansas":"KS","Kentucky":"KY","Louisiana":"LA","Maine":"ME","Maryland":"MD","Massachusetts":"MA","Michigan":"MI","Minnesota":"MN","Mississippi":"MS","Missouri":"MO","Montana":"MT","Nebraska":"NE","Nevada":"NV","New Hampshire":"NH","New Jersey":"NJ","New Mexico":"NM","New York":"NY","North Carolina":"NC","North Dakota":"ND","Ohio":"OH","Oklahoma":"OK","Oregon":"OR","Pennsylvania":"PA","Rhode Island":"RI","South Carolina":"SC","South Dakota":"SD","Tennessee":"TN","Texas":"TX","Utah":"UT","Vermont":"VT","Virginia":"VA","Washington":"WA","West Virginia":"WV","Wisconsin":"WI","Wyoming":"WY","British Columbia":"BC","Ontario":"ON","Quebec":"QC","Alberta":"AB"};
function toST(loc){if(!loc)return loc;const ci=loc.lastIndexOf(',');if(ci<0)return loc;
  const city=loc.substring(0,ci).trim();let st=loc.substring(ci+1).trim();
  if(st.length===2)return city+', '+st.toUpperCase();
  if(SA[st])return city+', '+SA[st];
  // Try title case match
  const tc=st.charAt(0).toUpperCase()+st.slice(1).toLowerCase();
  for(const[full,abbr]of Object.entries(SA)){if(full.toLowerCase()===st.toLowerCase())return city+', '+abbr;}
  return loc;}

// ─── Local TRM Parser (instant, no AI needed) ──────────────────────
// Detects the repeating TRM pattern: origin, dest, date, time, date, time, equipment, "Select Item N"
function tryLocalParse(text){
  const lines=text.split(/\n/).map(l=>l.trim()).filter(l=>l);
  // Check if this looks like TRM format by finding "Select Item" markers
  const selectItems=lines.filter(l=>/^Select Item \d+/i.test(l));
  if(selectItems.length<2)return null; // Not TRM format — fall back to AI

  const loads=[];
  // Split into blocks by "Select Item"
  const blocks=[];let cur=[];
  for(const line of lines){
    if(/^Select Item \d+/i.test(line)){
      if(cur.length>0)blocks.push(cur);
      cur=[];
    } else {
      cur.push(line);
    }
  }
  if(cur.length>0)blocks.push(cur);

  // Also handle case where "Select Item" comes at END of each block
  // Re-parse: find all content between Select Item markers
  const text2=lines.join('\n');
  const parts=text2.split(/Select Item \d+\s*/i).filter(s=>s.trim());

  const parseBlock=(blockLines)=>{
    // Expect: origin(city,state), dest(city,state), pu_date, pu_time, del_date, del_time, equipment
    // Lines may be 6-7 items depending on format
    const bl=blockLines.filter(l=>l&&!/^Select Item/i.test(l));
    if(bl.length<5)return null;

    // Detect which lines are dates (M/D/YYYY or MM/DD/YYYY)
    const isDate=(s)=>/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(s);
    // Detect time or time window
    const isTime=(s)=>/^\d{1,2}:\d{2}/.test(s);
    // Detect equipment
    const isEquip=(s)=>/van|reefer|flat|dry|step|straight|tanker|trailer/i.test(s);

    let origin='',dest='',puDate='',puTime='',delDate='',delTime='',equip='Van/Dry Van';

    // Strategy: find the first two non-date, non-time, non-equipment lines as origin/dest
    // Then dates and times in order
    const locs=[],dates=[],times=[];
    for(const l of bl){
      if(isEquip(l)&&!isDate(l)&&!isTime(l)){equip=l;}
      else if(isDate(l)){dates.push(l);}
      else if(isTime(l)){times.push(l);}
      else if(l.includes(',')&&!isDate(l)){locs.push(l);}
    }

    if(locs.length>=2){origin=locs[0];dest=locs[1];}
    else if(locs.length===1){origin=locs[0];}
    if(dates.length>=2){puDate=dates[0];delDate=dates[1];}
    else if(dates.length===1){puDate=dates[0];}
    if(times.length>=2){puTime=times[0];delTime=times[1];}
    else if(times.length===1){puTime=times[0];}

    // Normalize city names (Title Case) and convert state to abbreviation
    const normCity=(c)=>{
      if(!c)return c;
      const parts=c.split(',');
      if(parts.length<2)return c;
      const city=parts[0].trim().split(/\s+/).map(w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(' ');
      const state=parts.slice(1).join(',').trim();
      return toST(city+', '+state);
    };

    origin=normCity(origin);
    dest=normCity(dest);

    // Convert M/D/YYYY to YYYY-MM-DD
    const convDate=(d)=>{
      if(!d)return'';
      const m=d.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
      if(m)return`${m[3]}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;
      return d;
    };
    puDate=convDate(puDate);delDate=convDate(delDate);

    // Map equipment strings
    const eqMap={'Dry Van 53\'':'Van/Dry Van','Van/Reefer 53\'':'Van/Reefer','Reefer 53\'':'Reefer','Flatbed 53\'':'Flatbed','Step Deck 53\'':'Step Deck'};
    equip=eqMap[equip]||equip;
    if(!EQ_ALL.includes(equip)){
      if(/dry van|van.*53|53.*van/i.test(equip))equip='Van/Dry Van';
      else if(/reefer|refriger/i.test(equip))equip='Reefer';
      else if(/flat/i.test(equip))equip='Flatbed';
      else if(/step/i.test(equip))equip='Step Deck';
      else if(/straight|box/i.test(equip))equip='Straight Truck';
      else if(/tank/i.test(equip))equip='Tanker';
      else equip='Van/Dry Van';
    }

    if(!origin||!dest)return null;
    return{origin,destination:dest,equipment:equip,weight:40000,rate:'',
      pickup_date:puDate,pickup_time:puTime,delivery_date:delDate,delivery_time:delTime,notes:''};
  };

  // Try parsing from the split parts
  for(const part of parts){
    const bl=part.split(/\n/).map(l=>l.trim()).filter(l=>l);
    const load=parseBlock(bl);
    if(load)loads.push(load);
  }

  return loads.length>0?loads:null;
}

async function callClaude(sys,text){const key=localStorage.getItem("fm_key");if(!key)throw new Error("NO_KEY");
  const r=await fetch("https://api.deepseek.com/chat/completions",{method:"POST",
    headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},
    body:JSON.stringify({model:"deepseek-chat",max_tokens:8192,temperature:0.1,
      response_format:{type:"json_object"},
      messages:[{role:"system",content:sys+" RESPOND WITH ONLY A VALID JSON ARRAY."},{role:"user",content:text}]})});
  if(!r.ok){const e=await r.json().catch(()=>({}));if(r.status===401)throw new Error("INVALID_KEY");if(r.status===429)throw new Error("RATE_LIMITED");
    throw new Error(e.error?.message||`Error ${r.status}`);}
  const d=await r.json();const t=(d.choices?.[0]?.message?.content||"").replace(/```json\s*/g,"").replace(/```\s*/g,"").trim();
  const s=t.indexOf("["),e=t.lastIndexOf("]");if(s===-1||e===-1)throw new Error("No valid data returned. Try again.");return JSON.parse(t.substring(s,e+1));}
function chunk(t,m=10000){if(t.length<=m)return[t];const items=t.split(/(?=Select Item \d)/i).filter(s=>s.trim());
  if(items.length>1){const c=[];let cur="";for(const it of items){if((cur+it).length>m&&cur){c.push(cur);cur="";}cur+=it;}if(cur)c.push(cur);return c;}
  const lines=t.split('\n');const c=[];let cur=[];let len=0;for(const l of lines){cur.push(l);len+=l.length;if(len>m){c.push(cur.join('\n'));cur=[];len=0;}}if(cur.length)c.push(cur.join('\n'));return c;}
async function callChunked(sys,text,onP){const ch=chunk(text);if(ch.length===1)return callClaude(sys,text);
  let all=[];for(let i=0;i<ch.length;i++){if(onP)onP(i+1,ch.length);const r=await callClaude(sys,ch[i]);if(Array.isArray(r))all=all.concat(r);}return all;}

// ─── Email with Canvas Image ────────────────────────────────────────
function generateLaneCanvas(loads){
  if(loads.length>25) loads=loads.slice(0,25);
  const rowH=44,headerH=44;
  const cols=[
    {label:'Origin',w:220},{label:'Destination',w:220},
    {label:'PU Date',w:100},{label:'PU Time',w:130},
    {label:'DEL Date',w:100},{label:'DEL Time',w:130},
    {label:'Equipment',w:140},{label:'Distance',w:90}
  ];
  let tableW=0;cols.forEach(c=>{tableW+=c.w;});
  const W=tableW+2,H=headerH+(Math.max(loads.length,1)*rowH)+2;
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const x=cv.getContext('2d');

  x.fillStyle='#ffffff';x.fillRect(0,0,W,H);
  x.fillStyle='#fafafa';x.fillRect(0,0,W,headerH);
  x.strokeStyle='#e0e0e0';x.lineWidth=1;x.beginPath();x.moveTo(0,headerH);x.lineTo(W,headerH);x.stroke();
  let hx=1;
  cols.forEach((cl,ci)=>{
    x.font='bold 13px -apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif';
    x.fillStyle='#222';x.textAlign='left';
    x.fillText(cl.label,hx+12,headerH/2+5);
    const lw=x.measureText(cl.label).width;
    x.font='400 10px Arial';x.fillStyle='#999';x.fillText('\u2193',hx+12+lw+5,headerH/2+5);
    if(ci<cols.length-1){x.strokeStyle='#e8e8e8';x.lineWidth=0.5;x.beginPath();x.moveTo(hx+cl.w,0);x.lineTo(hx+cl.w,headerH);x.stroke();}
    hx+=cl.w;
  });

  let ry=headerH;
  if(loads.length===0){
    x.fillStyle='#fff';x.fillRect(0,ry,W,rowH);
    x.fillStyle='#aaa';x.font='italic 13px -apple-system,Arial,sans-serif';x.textAlign='center';
    x.fillText('No loads found',W/2,ry+rowH/2+4);
  } else {
    loads.forEach((ld,li)=>{
      x.fillStyle=li%2===0?'#ffffff':'#fafbfc';x.fillRect(0,ry,W,rowH);
      x.strokeStyle='#eeeeee';x.lineWidth=0.5;x.beginPath();x.moveTo(0,ry+rowH);x.lineTo(W,ry+rowH);x.stroke();
      const vals=[ld.origin,ld.dest,ld.shipDate,ld.shipTime,ld.delDate,ld.delTime,ld.eq,ld.distance];
      let cx=1;
      vals.forEach((v,vi)=>{
        x.fillStyle=vi===6?'#0d8abc':vi===7?'#666':'#333';
        x.font='400 13px -apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif';x.textAlign='left';
        let maxW=cols[vi].w-24;let txt=v||'';
        while(x.measureText(txt).width>maxW&&txt.length>3)txt=txt.slice(0,-1);
        if(txt!==v&&v)txt+='...';
        x.fillText(txt,cx+12,ry+rowH/2+5);
        if(vi<cols.length-1){x.strokeStyle='#f0f0f0';x.lineWidth=0.3;x.beginPath();x.moveTo(cx+cols[vi].w,ry);x.lineTo(cx+cols[vi].w,ry+rowH);x.stroke();}
        cx+=cols[vi].w;
      });
      ry+=rowH;
    });
  }
  x.strokeStyle='#ddd';x.lineWidth=1;x.strokeRect(0,0,W,H);
  return cv;
}

// Strip year from date: "2026-03-19" → "3/19" or "3/19/2026" → "3/19"
function fmtDate(d){
  if(!d)return'';
  // Handle YYYY-MM-DD
  const iso=d.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(iso)return parseInt(iso[2])+'/'+parseInt(iso[3]);
  // Handle M/D/YYYY
  const mdy=d.match(/^(\d{1,2})\/(\d{1,2})\/\d{4}$/);
  if(mdy)return mdy[1]+'/'+mdy[2];
  // Handle M/D/YY
  const mdy2=d.match(/^(\d{1,2})\/(\d{1,2})\/\d{2}$/);
  if(mdy2)return mdy2[1]+'/'+mdy2[2];
  return d;
}

function buildEmailWithImage(truck,ml){
  const nm=truck.driver||truck.carrier||'';
  const greeting=nm?`Hi ${nm.split('@')[0]},`:'Good afternoon,';
  const imgPlaceholder='[See attached image for load details]';
  const hasLanes=(truck.preferred_destinations||[]).length>0;

  const canvasLoads=ml.map(m=>({
    origin:m.load.origin,dest:m.load.destination,
    shipDate:fmtDate(m.load.pickup_date),shipTime:m.load.pickup_time||'',
    delDate:fmtDate(m.load.delivery_date),delTime:m.load.delivery_time||'',
    eq:m.load.equipment,distance:m.distance+' mi'
  }));
  const canvas=generateLaneCanvas(canvasLoads);

  // Build the lane context sentence
  let laneContext='';
  if(hasLanes){
    const dests=truck.preferred_destinations.join(' / ');
    laneContext=` looking to go to ${dests}`;
  }

  const subj=ml.length===1
    ?`Load Opportunity: ${ml[0].load.origin} to ${ml[0].load.destination} (${ml[0].load.equipment})`
    :`${ml.length} Load Opportunities Near ${truck.location}`;

  const emailText=`${greeting}

Thank you for sharing your truck availability with us. After cross-referencing your truck list against our current load board, we found ${ml.length===1?'an option':'some options'} for your ${truck.equipment} in ${truck.location}${laneContext}.

${imgPlaceholder}

If ${ml.length===1?'this works':'any of these work'} for you, just let me know!

Thanks,
${localStorage.getItem('fm_sender')||'Alec'}`;

  return{subj,emailText,canvas,imgPlaceholder};
}

// Build email for ALL matches across multiple trucks (same carrier)
function buildBulkEmail(truckMatches){
  // truckMatches = [{truck, matches:[...]}, ...]
  const carrier=truckMatches[0].truck.carrier||'';
  const nm=truckMatches[0].truck.driver||carrier||'';
  const greeting=nm?`Hi ${nm.split('@')[0]},`:'Good afternoon,';
  const imgPlaceholder='[See attached image for load details]';

  // Combine all loads for the canvas
  const allLoads=[];
  truckMatches.forEach(({truck,matches:tm})=>{
    tm.forEach(m=>{allLoads.push({
      origin:m.load.origin,dest:m.load.destination,
      shipDate:fmtDate(m.load.pickup_date),shipTime:m.load.pickup_time||'',
      delDate:fmtDate(m.load.delivery_date),delTime:m.load.delivery_time||'',
      eq:m.load.equipment,distance:m.distance+' mi'
    });});
  });
  const canvas=generateLaneCanvas(allLoads);

  // Build truck descriptions
  const truckDescs=truckMatches.map(({truck,matches:tm})=>{
    const hasLanes=(truck.preferred_destinations||[]).length>0;
    const laneStr=hasLanes?` looking to go to ${truck.preferred_destinations.join(' / ')}`:'';
    return `• ${truck.equipment} in ${truck.location}${laneStr} — ${tm.length} option${tm.length!==1?'s':''}`;
  }).join('\n');

  const totalLoads=truckMatches.reduce((s,t)=>s+t.matches.length,0);
  const subj=`${totalLoads} Load Opportunities for Your Trucks`;

  const emailText=`${greeting}

Thank you for sharing your truck availability with us. After cross-referencing your truck list against our current load board, we found options for the following:

${truckDescs}

Here are the details:

${imgPlaceholder}

If any of these work for you, just let me know!

Thanks,
${localStorage.getItem('fm_sender')||'Alec'}`;

  return{subj,emailText,canvas,imgPlaceholder};
}

function doSendEmail(emailData,carrierEmail){
  // Track usage stats
  const sent=parseInt(localStorage.getItem('fm_emails_sent')||'0')+1;
  localStorage.setItem('fm_emails_sent',sent);
  window.dispatchEvent(new CustomEvent('fm-email-sent'));
  const{subj,emailText,canvas,imgPlaceholder}=emailData;
  const dataUrl=canvas.toDataURL('image/png');
  const imgIdx=emailText.indexOf(imgPlaceholder);
  const before=emailText.substring(0,imgIdx).trim();
  const after=emailText.substring(imgIdx+imgPlaceholder.length).trim();

  const htmlBody='<div style="font-family:Arial,sans-serif;font-size:14px;color:#333;line-height:1.6;">'+
    '<p style="margin:0 0 12px;">'+before.replace(/\n\n/g,'</p><p style="margin:0 0 12px;">').replace(/\n/g,'<br>')+'</p>'+
    '<img src="'+dataUrl+'" style="max-width:100%;border-radius:4px;margin:12px 0;display:block;" />'+
    '<p style="margin:12px 0 0;">'+after.replace(/\n\n/g,'</p><p style="margin:0 0 12px;">').replace(/\n/g,'<br>')+'</p>'+
    '</div>';
  const plainText=emailText.replace(imgPlaceholder,'[Load details table — paste email to see image]');
  const mailtoUrl='mailto:'+encodeURIComponent(carrierEmail||'')+'?subject='+encodeURIComponent(subj);

  try{
    const htmlBlob=new Blob([htmlBody],{type:'text/html'});
    const textBlob=new Blob([plainText],{type:'text/plain'});
    navigator.clipboard.write([new ClipboardItem({'text/html':htmlBlob,'text/plain':textBlob})]).then(()=>{
      showToast('✅ Email copied with load image — paste into your email body','success',4000);
      setTimeout(()=>{window.location.href=mailtoUrl;},800);
    }).catch(()=>{window.open(mailtoUrl+'&body='+encodeURIComponent(plainText));});
  }catch(e){window.open(mailtoUrl+'&body='+encodeURIComponent(plainText));}
}
function sendEmailWithImage(truck,ml){doSendEmail(buildEmailWithImage(truck,ml),truck.carrier||'');}
function sendBulkEmail(truckMatches){doSendEmail(buildBulkEmail(truckMatches),truckMatches[0].truck.carrier||'');}

function addArrow(layer,from,to,color,weight,opacity,dashed){
  L.polyline([from,to],{color,weight,opacity,dashArray:dashed?'6 4':''}).addTo(layer);
  const dx=to[1]-from[1],dy=to[0]-from[0],a=Math.atan2(dx,dy),len=0.25;
  L.polygon([to,[to[0]-len*Math.cos(a-0.4),to[1]-len*Math.sin(a-0.4)],[to[0]-len*Math.cos(a+0.4),to[1]-len*Math.sin(a+0.4)]],
    {color,weight:0,fillColor:color,fillOpacity:opacity,stroke:false}).addTo(layer);}

function USMap({trucks,loads,matches,selTruck,radius,onTruckClick,showSplash}){
  const mapRef=useRef(null);const mapI=useRef(null);
  const ly=useRef({trucks:null,loads:null,routes:null,match:null,lanes:null,rc:null});

  useEffect(()=>{if(mapI.current||!mapRef.current)return;
    const map=L.map(mapRef.current,{center:[39,-98],zoom:4,minZoom:3,maxZoom:18,maxBounds:[[20,-135],[55,-55]],maxBoundsViscosity:0.8});
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:19}).addTo(map);
    ly.current={trucks:L.layerGroup().addTo(map),loads:L.layerGroup().addTo(map),routes:L.layerGroup().addTo(map),match:L.layerGroup().addTo(map),lanes:L.layerGroup().addTo(map),rc:null};
    const lg=L.control({position:'bottomleft'});
    lg.onAdd=function(){const d=L.DomUtil.create('div','');
      d.style.cssText='background:rgba(13,13,13,0.92);padding:14px 16px;border-radius:14px;border:1px solid #333;font-family:"DM Sans",sans-serif;font-size:11px;color:#b0b0b0;line-height:2.1;min-width:180px';
      d.innerHTML=`<div style="font-weight:800;color:#fafafa;margin-bottom:4px;font-size:13px;font-family:Outfit">🔥 LEGEND</div>
        <div style="font-size:9px;color:#666;font-weight:700;letter-spacing:1.5px;margin-bottom:2px">EQUIPMENT GLOW</div>
        ${Object.entries({"Flatbed":"#ff8c42","Van":"#4da6ff","Reefer":"#00d4aa","Step Deck":"#b388ff","Straight":"#ff4d4d","Tanker":"#ff69b4"}).map(([n,c])=>`<div style="display:flex;align-items:center;gap:7px"><span style="width:12px;height:12px;border-radius:50%;background:radial-gradient(circle,${c}66,${c}22);border:1px solid ${c}88"></span>${n}</div>`).join('')}
        <div style="font-size:9px;color:#666;font-weight:700;letter-spacing:1.5px;margin-top:6px;margin-bottom:2px">ICONS</div>
        <div style="display:flex;align-items:center;gap:7px">🚛 Truck</div>
        <div style="display:flex;align-items:center;gap:7px">📦 Load (origin)</div>
        <div style="display:flex;align-items:center;gap:7px">🔥 Match hotspot</div>
        <div style="font-size:9px;color:#666;font-weight:700;letter-spacing:1.5px;margin-top:6px;margin-bottom:2px">LINES</div>
        <div style="display:flex;align-items:center;gap:7px"><span style="width:18px;height:3px;background:linear-gradient(90deg,#00d4aa,#00ffc8);border-radius:2px"></span>Match</div>
        <div style="display:flex;align-items:center;gap:7px"><span style="width:18px;border-top:2px dashed #00bcd4"></span>Lane</div>
        <div style="display:flex;align-items:center;gap:7px"><span style="width:18px;border-top:2px dashed #ff4d4d"></span>Radius</div>`;
      return d;};lg.addTo(map);mapI.current=map;return()=>{map.remove();mapI.current=null;};
  },[]);

  // Fire splash
  useEffect(()=>{if(!showSplash||!mapRef.current)return;const c=mapRef.current;
    for(let i=0;i<5;i++){setTimeout(()=>{const s=document.createElement('div');s.className='fire-splash';
      const sz=100+Math.random()*200;s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*c.offsetWidth}px;top:${Math.random()*c.offsetHeight}px`;
      c.appendChild(s);setTimeout(()=>s.remove(),1000);},i*150);}
  },[showSplash]);

  // Trucks — 🚛 with equipment color glow
  useEffect(()=>{if(!mapI.current)return;const layer=ly.current.trucks;const laneL=ly.current.lanes;
    layer.clearLayers();laneL.clearLayers();
    trucks.forEach(t=>{if(!t.coords)return;const col=EC[t.equipment]||'#4da6ff';const sel=t.id===selTruck;
      const icon=L.divIcon({className:'',
        html:`<div style="position:relative;display:flex;align-items:center;justify-content:center">
          ${sel?`<div class="pulse-ring" style="position:absolute;width:32px;height:32px;border:2px solid ${col}"></div>`:''}
          <div style="width:${sel?34:28}px;height:${sel?34:28}px;border-radius:50%;background:radial-gradient(circle,${col}44 0%,${col}11 70%,transparent);display:flex;align-items:center;justify-content:center;
            ${sel?`box-shadow:0 0 18px ${col}66`:''};cursor:pointer">
            <span style="font-size:${sel?20:16}px;filter:drop-shadow(0 1px 2px rgba(0,0,0,0.5))">🚛</span>
          </div>
        </div>`,iconSize:[sel?34:28,sel?34:28],iconAnchor:[sel?17:14,sel?17:14]});
      const m=L.marker([t.coords.lat,t.coords.lng],{icon,zIndexOffset:sel?1000:0}).addTo(layer);
      const mc=(matches[t.id]||[]).length;const hl=(t.preferred_destinations||[]).length>0;
      m.bindPopup(`<div style="font-family:'DM Sans'"><div style="font-weight:700;font-size:14px">🚛 ${t.location}</div>
        <div style="display:flex;gap:4px;margin-top:6px"><span style="background:${col}22;color:${col};padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600">${t.equipment}</span></div>
        ${t.carrier?`<div style="font-size:11px;color:#00bcd4;margin-top:4px">${t.carrier}</div>`:''}
        ${hl?`<div style="font-size:11px;color:#00bcd4;margin-top:4px">→ ${t.preferred_destinations.join(', ')}</div>`:''}
        ${mc?`<div style="font-size:12px;color:#00d4aa;font-weight:700;margin-top:6px">🔥 ${mc} match${mc!==1?'es':''}</div>`:''}
      </div>`,{closeButton:false,offset:[0,-16]});
      m.on('click',()=>onTruckClick(t.id));m.on('mouseover',function(){this.openPopup();});m.on('mouseout',function(){this.closePopup();});
      if(hl)t.preferred_destinations.forEach(dest=>{const dc=geo(dest);if(dc)addArrow(laneL,[t.coords.lat,t.coords.lng],[dc.lat,dc.lng],'#00bcd4',1.8,sel?0.7:0.3,true);});
    });
  },[trucks,selTruck,matches]);

  // Loads — 📦 trailer icon with equipment color glow
  useEffect(()=>{if(!mapI.current)return;const loadL=ly.current.loads;const routeL=ly.current.routes;
    loadL.clearLayers();routeL.clearLayers();
    const mIds=selTruck?new Set((matches[selTruck]||[]).map(m=>m.loadId)):new Set();
    loads.forEach(l=>{if(!l.oc)return;const hi=mIds.has(l.id);if(selTruck&&!hi)return;
      const eqCol=EC[l.equipment]||'#4da6ff';const color=hi?'#00d4aa':eqCol;
      const oI=L.divIcon({className:'',
        html:`<div style="width:${hi?30:24}px;height:${hi?30:24}px;border-radius:50%;background:radial-gradient(circle,${color}${hi?'55':'33'} 0%,transparent 70%);display:flex;align-items:center;justify-content:center;
          ${hi?'box-shadow:0 0 14px '+color+'55':''}">
          <span style="font-size:${hi?16:13}px;filter:drop-shadow(0 1px 2px rgba(0,0,0,0.5))">📦</span>
        </div>`,iconSize:[hi?30:24,hi?30:24],iconAnchor:[hi?15:12,hi?15:12]});
      const om=L.marker([l.oc.lat,l.oc.lng],{icon:oI}).addTo(loadL);
      om.bindPopup(`<div style="font-family:'DM Sans'"><div style="font-weight:700;font-size:13px">📦 ${l.origin} → ${l.destination}</div>
        <div style="display:flex;gap:4px;margin-top:6px"><span style="background:${eqCol}22;color:${eqCol};padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600">${l.equipment}</span>
        ${l.rate?`<span style="background:#00d4aa22;color:#00d4aa;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600">$${l.rate}</span>`:''}</div>
        ${l.pickup_date?`<div style="font-size:11px;color:#b0b0b0;margin-top:4px">PU: ${l.pickup_date}${l.pickup_time?' '+l.pickup_time:''}</div>`:''}
      </div>`,{closeButton:false,offset:[0,-14]});
      om.on('mouseover',function(){this.openPopup();});om.on('mouseout',function(){this.closePopup();});
      if(l.dc){addArrow(routeL,[l.oc.lat,l.oc.lng],[l.dc.lat,l.dc.lng],color,hi?2.5:1,hi?0.75:0.15,!hi);
        const dI=L.divIcon({className:'',html:`<div style="width:8px;height:8px;background:${color};border-radius:50%;opacity:${hi?0.85:0.3}"></div>`,iconSize:[8,8],iconAnchor:[4,4]});
        L.marker([l.dc.lat,l.dc.lng],{icon:dI,interactive:false}).addTo(routeL);}
    });
  },[loads,selTruck,matches]);

  // Radius + fires at matches
  useEffect(()=>{if(!mapI.current)return;const ml=ly.current.match;ml.clearLayers();
    if(ly.current.rc){mapI.current.removeLayer(ly.current.rc);ly.current.rc=null;}
    if(selTruck){
      const truck=trucks.find(t=>t.id===selTruck);if(!truck?.coords)return;
      ly.current.rc=L.circle([truck.coords.lat,truck.coords.lng],{radius:radius*1609.34,color:'#ff4d4d',weight:2,dashArray:'8 4',fillColor:'#ff4d4d',fillOpacity:0.04}).addTo(mapI.current);
      (matches[selTruck]||[]).forEach(m=>{const load=loads.find(l=>l.id===m.loadId);if(!load?.oc)return;
        L.polyline([[truck.coords.lat,truck.coords.lng],[load.oc.lat,load.oc.lng]],{color:'#00d4aa',weight:2.5,opacity:0.7,dashArray:'6 4'}).addTo(ml);
        L.marker([load.oc.lat,load.oc.lng],{icon:L.divIcon({className:'',html:'<div class="fire-icon" style="font-size:22px;text-align:center;line-height:1">🔥</div>',iconSize:[22,22],iconAnchor:[11,18]}),interactive:false,zIndexOffset:2000}).addTo(ml);
      });
    } else {
      // Show fires at all match points
      const allMLoadIds=new Set();Object.values(matches).forEach(tm=>tm.forEach(m=>allMLoadIds.add(m.loadId)));
      loads.forEach(l=>{if(!l.oc||!allMLoadIds.has(l.id))return;
        L.marker([l.oc.lat,l.oc.lng],{icon:L.divIcon({className:'',html:'<div class="fire-icon" style="font-size:16px;text-align:center;opacity:0.8">🔥</div>',iconSize:[16,16],iconAnchor:[8,13]}),interactive:false,zIndexOffset:2000}).addTo(ml);});
      Object.keys(matches).forEach(tid=>{const truck=trucks.find(t=>t.id===tid);if(!truck?.coords)return;
        L.marker([truck.coords.lat,truck.coords.lng],{icon:L.divIcon({className:'',html:'<div class="fire-icon" style="font-size:14px;opacity:0.7">🔥</div>',iconSize:[14,14],iconAnchor:[7,16]}),interactive:false,zIndexOffset:2000}).addTo(ml);});
    }
  },[selTruck,trucks,loads,matches,radius]);

  return <div ref={mapRef} style={{width:"100%",height:"100%"}}/>;
}

function Tutorial({onClose,step,setStep}){
  const[cursorPos,setCursorPos]=useState({x:window.innerWidth/2,y:window.innerHeight/2});
  const s=TUTORIAL_STEPS[step];

  useEffect(()=>{
    const el=s.target?document.querySelector(s.target):null;
    if(el){const r=el.getBoundingClientRect();setCursorPos({x:r.left+r.width/2,y:r.top+r.height/2});}
    else{setCursorPos({x:window.innerWidth/2,y:window.innerHeight/2-50});}
  },[step]);

  const getHighlightStyle=()=>{
    if(!s.target)return{display:'none'};
    const el=document.querySelector(s.target);if(!el)return{display:'none'};
    const r=el.getBoundingClientRect();
    return{left:r.left-6,top:r.top-6,width:r.width+12,height:r.height+12};
  };

  const getTooltipStyle=()=>{
    if(s.pos==='center')return{left:'50%',top:'50%',transform:'translate(-50%,-50%)'};
    if(s.pos==='right-panel')return{right:320,top:200};
    const el=s.target?document.querySelector(s.target):null;
    if(!el)return{left:'50%',top:'50%',transform:'translate(-50%,-50%)'};
    const r=el.getBoundingClientRect();
    if(s.pos==='below')return{left:Math.max(20,r.left),top:r.bottom+16};
    return{left:r.right+16,top:r.top};
  };

  return(<div className="tutorial-overlay" onClick={e=>{if(e.target===e.currentTarget&&step<TUTORIAL_STEPS.length-1)setStep(step+1);}}>
    <div className="tutorial-highlight" style={getHighlightStyle()}/>
    <div className="tutorial-cursor" style={{left:cursorPos.x,top:cursorPos.y}}>👆</div>
    <div className="tutorial-tooltip fadeUp" style={getTooltipStyle()}>
      <div style={{fontSize:10,color:'#ff6b35',fontWeight:700,letterSpacing:1.5,marginBottom:6,fontFamily:'Outfit'}}>{step+1} / {TUTORIAL_STEPS.length}</div>
      <div style={{fontSize:16,fontWeight:800,fontFamily:'Outfit',marginBottom:8}}>{s.title}</div>
      <div style={{fontSize:13,color:'#b0b0b0',lineHeight:1.7,marginBottom:16}}>{s.desc}</div>
      <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
        {step>0&&<button onClick={()=>setStep(step-1)} style={{background:'transparent',color:'#888',border:'1px solid #333',borderRadius:10,padding:'8px 16px',fontSize:12,fontFamily:'DM Sans'}}>Back</button>}
        {step<TUTORIAL_STEPS.length-1?
          <button onClick={()=>setStep(step+1)} style={{background:'linear-gradient(135deg,#ff4d4d,#ff6b35)',color:'#fff',border:'none',borderRadius:10,padding:'8px 20px',fontSize:13,fontWeight:700,fontFamily:'Outfit',boxShadow:'0 4px 16px rgba(255,77,77,0.3)'}}>Next</button>
          :<button onClick={onClose} style={{background:'linear-gradient(135deg,#00d4aa,#00b894)',color:'#000',border:'none',borderRadius:10,padding:'8px 20px',fontSize:13,fontWeight:700,fontFamily:'Outfit'}}>Get Started 🔥</button>
        }
        <button onClick={onClose} style={{background:'transparent',color:'#555',border:'none',fontSize:12,padding:'8px'}}>Skip</button>
      </div>
    </div>
  </div>);}

function SettingsPanel({onClose,senderName,setSenderName,trucks,loads,matches,emailsSent}){
  const[activeTab,setActiveTab]=useState('settings');
  const totM=Object.values(matches).reduce((s,m)=>s+m.length,0);
  const totalEmails=parseInt(localStorage.getItem('fm_emails_sent')||'0');

  // Calculate workflow savings
  const manualMinPerMatch=8; // minutes per match manually (call broker, cross-ref, email)
  const autoMinPerMatch=0.5; // with app
  const timeSavedMin=totM*(manualMinPerMatch-autoMinPerMatch);
  const hourlyRate=35; // avg dispatcher rate $/hr
  const moneySaved=Math.round((timeSavedMin/60)*hourlyRate);
  const totalTrucks=trucks.length;const totalLoads=loads.length;

  const st={label:{fontSize:11,color:'#555',fontWeight:700,letterSpacing:1,textTransform:'uppercase',marginBottom:6,display:'block'},
    input:{width:'100%',background:'var(--dark)',border:'1px solid var(--dark3)',borderRadius:10,padding:'10px 14px',color:'var(--text)',fontSize:13,outline:'none',fontFamily:"'DM Sans'"}};

  return(<div style={{position:'fixed',inset:0,zIndex:10000,display:'flex',alignItems:'center',justifyContent:'center',background:'rgba(0,0,0,0.7)'}}>
    <div className="fadeUp" style={{width:680,maxWidth:'95vw',maxHeight:'90vh',background:'var(--dark2)',borderRadius:20,border:'1px solid var(--dark3)',overflow:'hidden',display:'flex',flexDirection:'column',boxShadow:'0 24px 64px rgba(0,0,0,0.6)'}}>
      <div style={{padding:'18px 24px',borderBottom:'1px solid var(--dark3)',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <div style={{fontSize:18,fontWeight:800,fontFamily:'Outfit'}}>⚙️ Settings</div>
        <button onClick={onClose} style={{background:'transparent',color:'#888',border:'none',fontSize:20}}>✕</button>
      </div>
      <div style={{display:'flex',borderBottom:'1px solid var(--dark3)'}}>
        {[['settings','⚙️ General'],['workflow','📊 Workflow Benefits']].map(([id,label])=>(
          <button key={id} onClick={()=>setActiveTab(id)} style={{flex:1,padding:'12px',border:'none',fontSize:13,fontWeight:activeTab===id?700:400,fontFamily:'Outfit',
            background:activeTab===id?'rgba(255,77,77,0.08)':'transparent',color:activeTab===id?'#ff6b35':'#666',
            borderBottom:activeTab===id?'2px solid #ff4d4d':'2px solid transparent'}}>{label}</button>))}
      </div>
      <div style={{flex:1,overflow:'auto',padding:24}}>

        {activeTab==='settings'&&(<div style={{display:'flex',flexDirection:'column',gap:20}}>
          <div><label style={st.label}>Your Name (email sign-off)</label>
            <input value={senderName} onChange={e=>{setSenderName(e.target.value);localStorage.setItem('fm_sender',e.target.value);}}
              style={st.input} placeholder="Alec"/></div>
          <div><label style={st.label}>Default Radius (miles)</label>
            <input type="number" defaultValue={parseInt(localStorage.getItem('fm_radius'))||100}
              onChange={e=>{localStorage.setItem('fm_radius',e.target.value);}} style={st.input}/></div>
          <div><label style={st.label}>DeepSeek API Key</label>
            <div style={{display:'flex',gap:8}}>
              <input type="password" value={localStorage.getItem('fm_key')||''} readOnly style={{...st.input,flex:1,color:'#555'}}/>
              <button onClick={()=>{if(confirm('Change API key?')){localStorage.removeItem('fm_key');location.reload();}}}
                style={{background:'var(--dark)',color:'#ff6b35',border:'1px solid var(--dark3)',borderRadius:10,padding:'10px 16px',fontSize:12,fontWeight:600,whiteSpace:'nowrap'}}>Change Key</button>
            </div></div>
          <div style={{borderTop:'1px solid var(--dark3)',paddingTop:16}}>
            <label style={st.label}>Session Data</label>
            <div style={{display:'flex',gap:8}}>
              <button onClick={()=>{const data={trucks,loads,settings:{senderName,radius:localStorage.getItem('fm_radius')}};
                const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);
                const a=document.createElement('a');a.href=url;a.download=`freight-matcher-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();
                showToast('Session exported','success');}}
                style={{background:'rgba(0,212,170,0.1)',color:'#00d4aa',border:'1px solid rgba(0,212,170,0.2)',borderRadius:10,padding:'10px 16px',fontSize:12,fontWeight:600}}>
                📥 Export Session</button>
              <button onClick={()=>{const input=document.createElement('input');input.type='file';input.accept='.json';

function App(){
  const[hasKey,setHasKey]=useState(!!localStorage.getItem("fm_key"));
  const[tab,setTab]=useState("trucks");const prevTab=useRef("trucks");
  const session=useRef(loadSession());
  // Dedup persisted data on load
  const dedupTrucks=(arr)=>{const m=new Map();arr.forEach(t=>{const k=`${(t.location||'').toLowerCase().trim()}|${(t.carrier||'').toLowerCase().trim()}`;
    if(!m.has(k))m.set(k,t);else{const e=m.get(k);(t.preferred_destinations||[]).forEach(d=>{if(!(e.preferred_destinations||[]).includes(d))(e.preferred_destinations=e.preferred_destinations||[]).push(d);});
      if(t.available&&!e.available)e.available=t.available;}});return[...m.values()];};
  const dedupLoads=(arr)=>{const m=new Map();arr.forEach(l=>{const k=`${(l.origin||'').toLowerCase()}|${(l.destination||'').toLowerCase()}|${l.pickup_date||''}|${l.pickup_time||''}`;
    if(!m.has(k))m.set(k,l);});return[...m.values()];};
  const[trucks,setTrucks]=useState(()=>dedupTrucks(session.current.trucks));
  const[loads,setLoads]=useState(()=>dedupLoads(session.current.loads));
  const[radius,setRadius]=useState(parseInt(localStorage.getItem('fm_radius'))||100);const[selTruck,setSelTruck]=useState(null);
  const[eqF,setEqF]=useState(new Set(EQ_ALL));const[minWt,setMinWt]=useState(0);const[showMoreEq,setShowMoreEq]=useState(false);
  const[tP,setTP]=useState(false);const[pT,setPT]=useState(null);const[tE,setTE]=useState("");const[tClear,setTClear]=useState(0);
  const[lP,setLP]=useState(false);const[pL,setPL]=useState(null);const[lE,setLE]=useState("");const[lProg,setLProg]=useState("");const[lClear,setLClear]=useState(0);
  const[mapSplash,setMapSplash]=useState(false);
  const[showTutorial,setShowTutorial]=useState(false);const[tutStep,setTutStep]=useState(0);
  const[showHelp,setShowHelp]=useState(false);const[showSettings,setShowSettings]=useState(false);
  const[senderName,setSenderName]=useState(localStorage.getItem('fm_sender')||'Alec');
  const[emailsSent,setEmailsSent]=useState(parseInt(localStorage.getItem('fm_emails_sent'))||0);
  const[matchesMade,setMatchesMade]=useState(parseInt(localStorage.getItem('fm_matches_made'))||0);

  // Auto-save trucks/loads/radius to localStorage
  useEffect(()=>{saveSession(trucks,loads);},[trucks,loads]);
  useEffect(()=>{localStorage.setItem('fm_radius',radius);},[radius]);
  useEffect(()=>{const h=()=>setEmailsSent(parseInt(localStorage.getItem('fm_emails_sent')||'0'));
    window.addEventListener('fm-email-sent',h);return()=>window.removeEventListener('fm-email-sent',h);},[]);

  useEffect(()=>{if(tab==="map"&&prevTab.current!=="map"){const tot=Object.values(matches).reduce((s,m)=>s+m.length,0);
    if(tot>0){setMapSplash(true);setTimeout(()=>setMapSplash(false),1200);}}prevTab.current=tab;},[tab]);

  // ─── Region definitions ────────────────────────────────────────────
  const REGIONS={
    "midwest":["IL","IN","IA","KS","MI","MN","MO","NE","ND","OH","SD","WI"],
    "east coast":["CT","DE","FL","GA","ME","MD","MA","NH","NJ","NY","NC","PA","RI","SC","VA","VT","WV","DC"],
    "eastern":["CT","DE","FL","GA","ME","MD","MA","NH","NJ","NY","NC","PA","RI","SC","VA","VT","WV","DC"],
    "northeast":["CT","DE","ME","MD","MA","NH","NJ","NY","PA","RI","VT","DC"],
    "southeast":["AL","AR","FL","GA","KY","LA","MS","NC","SC","TN","VA","WV"],
    "south":["AL","AR","FL","GA","KY","LA","MS","NC","OK","SC","TN","TX","VA","WV"],
    "southwest":["AZ","NM","NV","TX","OK","UT","CO"],
    "west coast":["CA","OR","WA"],
    "western":["AZ","CA","CO","ID","MT","NM","NV","OR","UT","WA","WY"],
    "northwest":["ID","MT","OR","WA","WY"],
    "pacific northwest":["OR","WA","ID"],
    "pnw":["OR","WA","ID"],
    "great lakes":["IL","IN","MI","MN","OH","WI"],
    "plains":["IA","KS","MN","MO","NE","ND","SD"],
    "mountain":["CO","ID","MT","NV","UT","WY"],
    "new england":["CT","ME","MA","NH","RI","VT"],
    "mid-atlantic":["DE","MD","NJ","NY","PA","DC"],
    "gulf":["AL","FL","LA","MS","TX"],
    "texas":["TX"],"california":["CA"],"florida":["FL"],
  };

  // Extract state from "City, ST" format
  function getState(loc){if(!loc)return null;const parts=loc.split(",");if(parts.length<2)return null;return parts[parts.length-1].trim().toUpperCase();}

  // Check if a load's destination matches a regional preference
  function matchesRegion(loadDest,prefDest){
    const regionKey=prefDest.toLowerCase().trim();
    const states=REGIONS[regionKey];
    if(!states)return false;
    const destState=getState(loadDest);
    if(!destState)return false;
    return states.includes(destState);
  }

  // Lane-aware matching engine (with region support)
  const matches=useMemo(()=>{const r={};
    for(const truck of trucks){if(!truck.coords||!eqF.has(truck.equipment))continue;const tm=[];
      const hasLanes=(truck.preferred_destinations||[]).length>0;
      // Pre-compute preferred destination coords (may be null for regions)
      const laneDests=hasLanes?truck.preferred_destinations.map(d=>{
        const coords=geo(d);
        const isRegion=REGIONS[d.toLowerCase().trim()]?true:false;
        return{name:d,coords,isRegion};
      }):[];

      for(const load of loads){if(!load.oc)continue;
        // Equipment compatibility
        // Van/Reefer loads can go on either Van or Reefer trucks
        // Trailer loads can go on any van-type truck
        const vanTypes=["Van/Dry Van","Reefer","Van/Reefer","Trailer"];
        let eqMatch=false;
        if(load.equipment===truck.equipment) eqMatch=true;
        // Van/Reefer load matches both Van and Reefer trucks
        else if(load.equipment==="Van/Reefer"&&(truck.equipment==="Van/Dry Van"||truck.equipment==="Reefer")) eqMatch=true;
        // Reefer truck can haul Van/Dry Van loads (reefer can run dry)
        else if(truck.equipment==="Reefer"&&(load.equipment==="Van/Dry Van"||load.equipment==="Trailer")) eqMatch=true;
        // Trailer loads match any van-type truck
        else if(load.equipment==="Trailer"&&vanTypes.includes(truck.equipment)) eqMatch=true;
        if(!eqMatch)continue;
        if(load.weight>truck.weight)continue;if(load.weight<minWt&&minWt>0)continue;

        // Distance from truck to load origin
        const originDist=hav(truck.coords.lat,truck.coords.lng,load.oc.lat,load.oc.lng);
        if(originDist>radius)continue;

        // If truck has NO preferred lanes → standard radius match (any direction)
        if(!hasLanes){
          tm.push({loadId:load.id,distance:Math.round(originDist),load,laneMatch:false});
          continue;
        }

        // If truck HAS preferred lanes → load destination must align with a lane
        if(!load.dc&&!load.destination)continue;

        let bestLaneScore=0;
        for(const lane of laneDests){
          // REGION MATCH: check if load destination state is in the region
          if(lane.isRegion){
            if(matchesRegion(load.destination,lane.name)){
              bestLaneScore=Math.max(bestLaneScore,0.8); // strong match
            }
            continue;
          }

          // CITY-TO-CITY MATCH: original lane logic
          if(!lane.coords||!load.dc)continue;
          const laneLen=hav(truck.coords.lat,truck.coords.lng,lane.coords.lat,lane.coords.lng);
          if(laneLen<5)continue;

          const destToLane=hav(load.dc.lat,load.dc.lng,lane.coords.lat,lane.coords.lng);
          const destToTruck=hav(load.dc.lat,load.dc.lng,truck.coords.lat,truck.coords.lng);

          const isAlongLane = (destToLane <= laneLen * 0.5) ||
            (destToTruck <= laneLen && destToLane <= laneLen);
          const goingWrongWay = destToLane > laneLen * 1.3 && destToTruck > laneLen * 0.3;

          if(isAlongLane && !goingWrongWay){
            const score = 1 - (destToLane / (laneLen + 1));
            if(score > bestLaneScore) bestLaneScore = score;
          }
        }

        if(bestLaneScore > 0){
          tm.push({loadId:load.id,distance:Math.round(originDist),load,laneMatch:true,laneScore:bestLaneScore});
        }
      }
      // Sort: lane matches first (by score), then by distance
      tm.sort((a,b)=>{
        if(a.laneMatch&&!b.laneMatch)return -1;if(!a.laneMatch&&b.laneMatch)return 1;
        if(a.laneMatch&&b.laneMatch)return(b.laneScore||0)-(a.laneScore||0);
        return a.distance-b.distance;
      });
      if(tm.length>0)r[truck.id]=tm;}return r;
  },[trucks,loads,radius,eqF,minWt]);
  const totM=Object.values(matches).reduce((s,m)=>s+m.length,0);

              {showMoreEq&&EQ_MORE.map(type=>(<label key={type} style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",padding:"5px 10px",borderRadius:8,fontSize:13,
                background:eqF.has(type)?EC[type]+'0d':'transparent'}}>
                <input type="checkbox" checked={eqF.has(type)} onChange={()=>togEq(type)} style={{accentColor:EC[type]}}/>
                <span style={{width:10,height:10,borderRadius:'50%',background:`radial-gradient(circle,${EC[type]}66,${EC[type]}22)`}}/><span style={{color:eqF.has(type)?'var(--text)':'#555'}}>{type}</span>
              </label>))}
            </div></div>

          {/* Selected truck */}
          {selTruck&&(()=>{const t=trucks.find(x=>x.id===selTruck),m=matches[selTruck]||[];
            return t?(<div style={{padding:14,borderRadius:12,background:'var(--dark)',border:`1px solid ${EC[t.equipment]}33`}}>
              <div style={{fontSize:12,fontWeight:700,color:'#ff6b35',marginBottom:4,fontFamily:'Outfit'}}>SELECTED</div>
              <div style={{fontSize:15,fontWeight:700,fontFamily:'Outfit'}}>🚛 {t.location}</div>
              {(t.preferred_destinations||[]).length>0&&<div style={{fontSize:12,color:'#00bcd4',marginTop:3}}>→ {t.preferred_destinations.join(', ')}</div>}
              <div style={{display:"flex",gap:6,marginTop:6}}><Badge color={EC[t.equipment]} small>{t.equipment}</Badge></div>
              <div style={{marginTop:8,fontSize:13,color:'#00d4aa',fontWeight:700}}>🔥 {m.length} match{m.length!==1?"es":""}</div>
              {m.slice(0,5).map((x,i)=>(<div key={i} style={{marginTop:8,padding:10,borderRadius:10,background:'var(--dark2)',fontSize:12,borderLeft:'3px solid #00d4aa'}}>
                <div style={{fontWeight:600}}>{x.load.origin} → {x.load.destination}</div>
                <div style={{color:'#888',marginTop:2}}>{x.distance} mi{x.load.rate&&` · $${x.load.rate}`}</div></div>))}
            </div>):null;})()}
        </div>
      </>}

      {tab==="matches"&&(<div style={{flex:1,overflow:"auto",padding:24}}><div style={{maxWidth:900,margin:"0 auto"}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:4}}>
          <div style={{fontSize:22,fontWeight:800,fontFamily:'Outfit'}}>🔥 Matches</div>
          {totM>0&&<div style={{display:'flex',gap:8}}>
            <button onClick={()=>exportMatchesCSV(matches,trucks,loads)}
              style={{background:'rgba(179,136,255,0.12)',color:'#b388ff',border:'1px solid rgba(179,136,255,0.2)',borderRadius:12,padding:"10px 16px",fontSize:13,fontWeight:600,fontFamily:'Outfit'}}>
              📊 Export CSV
            </button>
            <button onClick={()=>{
            // Group all matches by carrier, send one bulk email per carrier
            const byCarrier={};
            Object.entries(matches).forEach(([tid,tm])=>{
              const truck=trucks.find(t=>t.id===tid);if(!truck)return;
              const key=truck.carrier||truck.id;
              if(!byCarrier[key])byCarrier[key]=[];
              byCarrier[key].push({truck,matches:tm});
            });
            // For now send the first carrier group (or all if no carriers)
            const groups=Object.values(byCarrier);
            if(groups.length===1){sendBulkEmail(groups[0]);}
            else{
              // Multiple carriers — send them all as one combined email
              const allTruckMatches=groups.flat();
              sendBulkEmail(allTruckMatches);
            }
          }} style={{background:'linear-gradient(135deg,#4da6ff,#3b82f6)',color:'#fff',border:"none",borderRadius:12,padding:"10px 20px",fontSize:13,fontWeight:700,fontFamily:'Outfit',
            boxShadow:'0 2px 12px rgba(59,130,246,0.3)',display:'flex',alignItems:'center',gap:6}}>
            📧 Send All Matches ({totM})
          </button>
          </div>}
        </div>
        <div style={{fontSize:13,color:'#888',marginBottom:24}}>{totM} match{totM!==1?"es":""} within {radius} mi</div>
        {totM===0&&(<div style={{padding:48,textAlign:"center",color:'#555',background:'var(--dark2)',borderRadius:20,border:'1px solid var(--dark3)'}}>
          <div style={{fontSize:48,marginBottom:12,opacity:0.4}}>🔥</div><div style={{fontSize:16,fontWeight:600,fontFamily:'Outfit'}}>No matches yet</div>
          <div style={{fontSize:13,marginTop:6}}>{trucks.length===0?"Add trucks first":loads.length===0?"Add loads first":"Try increasing radius"}</div></div>)}
        {Object.entries(matches).map(([tid,tm])=>{const truck=trucks.find(t=>t.id===tid);if(!truck)return null;
          const hasLanes=(truck.preferred_destinations||[]).length>0;
          return(<div key={tid} className="fadeUp" style={{marginBottom:20,background:'var(--dark2)',borderRadius:20,border:'1px solid var(--dark3)',overflow:"hidden"}}>
            <div style={{padding:"16px 20px",borderBottom:'1px solid var(--dark3)',display:"flex",justifyContent:"space-between",alignItems:"center",
              background:`linear-gradient(135deg,${EC[truck.equipment]}08,transparent)`}}>
              <div><div style={{fontWeight:800,fontSize:16,fontFamily:'Outfit'}}>🚛 {truck.location}{truck.carrier?` · ${truck.carrier}`:""}</div>
                <div style={{display:"flex",gap:6,marginTop:5}}>
                  <Badge color={EC[truck.equipment]} small>{truck.equipment}</Badge>
                  {hasLanes&&<Badge color="#00bcd4" small>→ {truck.preferred_destinations.join(', ')}</Badge>}
                  {truck.available&&<Badge color="#ffb347" small>{truck.available}</Badge>}
                </div></div>
              <div style={{display:"flex",gap:8,alignItems:"center"}}>
                <button onClick={()=>sendEmailWithImage(truck,tm)}
                  style={{background:'linear-gradient(135deg,#4da6ff,#3b82f6)',color:'#fff',border:"none",borderRadius:10,padding:"7px 16px",fontSize:12,fontWeight:700,fontFamily:'Outfit',
                    boxShadow:'0 2px 12px rgba(59,130,246,0.3)'}}>📧 Email{tm.length>1?` All (${tm.length})`:''}</button>
                <div style={{background:'linear-gradient(135deg,#ff4d4d,#ff6b35)',color:'#fff',padding:"6px 14px",borderRadius:99,fontSize:13,fontWeight:800,fontFamily:'Outfit'}}>🔥 {tm.length}</div></div></div>
            {tm.map((x,i)=>(<div key={i} style={{padding:"12px 20px",borderBottom:i<tm.length-1?'1px solid var(--dark3)':"none",display:"flex",justifyContent:"space-between",alignItems:"center",fontSize:13}}>
              <div style={{flex:1}}><div><span style={{fontWeight:700}}>{x.load.origin}</span><span style={{color:'#555'}}> → </span>
                <span style={{fontWeight:700}}>{x.load.destination}</span>
                <span style={{color:'#888',marginLeft:8}}>{x.load.weight?.toLocaleString()} lbs{x.load.rate&&` · $${x.load.rate}`}</span>
                {x.laneMatch&&<span style={{marginLeft:6,background:'rgba(0,188,212,0.12)',color:'#00bcd4',padding:'1px 7px',borderRadius:99,fontSize:10,fontWeight:700}}>On Lane</span>}
                </div>
                {(x.load.pickup_date||x.load.delivery_date)&&<div style={{fontSize:11,color:'#666',marginTop:2}}>
                  {x.load.pickup_date&&`PU: ${x.load.pickup_date}${x.load.pickup_time?' '+x.load.pickup_time:''}`}
                  {x.load.pickup_date&&x.load.delivery_date&&' → '}
                  {x.load.delivery_date&&`DEL: ${x.load.delivery_date}${x.load.delivery_time?' '+x.load.delivery_time:''}`}</div>}</div>
              <div style={{display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
                <button onClick={()=>sendEmailWithImage(truck,[x])}
                  style={{background:'rgba(77,166,255,0.12)',color:'#4da6ff',border:'1px solid rgba(77,166,255,0.2)',borderRadius:8,padding:"4px 10px",fontSize:11}}>📧</button>
                <button onClick={()=>{navigator.clipboard.writeText(`${x.load.origin} → ${x.load.destination} | ${x.load.equipment} | ${(x.load.weight||0).toLocaleString()} lbs${x.load.rate?` | $${x.load.rate}`:''}`);}}
                  style={{background:'rgba(179,136,255,0.12)',color:'#b388ff',border:'1px solid rgba(179,136,255,0.2)',borderRadius:8,padding:"4px 10px",fontSize:11}}>📋</button>
                <div style={{color:x.distance<50?'#00d4aa':x.distance<100?'#ff8c42':'#888',fontWeight:800,fontSize:14,whiteSpace:"nowrap",minWidth:55,textAlign:"right",fontFamily:'Outfit'}}>{x.distance} mi</div></div>
            </div>))}</div>);})}
      </div></div>)}
    </div></div>
  </div>);}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>

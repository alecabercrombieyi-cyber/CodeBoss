<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Mass Post — 50 loads. 5 minutes. No retyping.">
  <defs>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf7f2"/>
      <stop offset="1" stop-color="#f1ead9"/>
    </linearGradient>
    <linearGradient id="pinkFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4738c"/>
      <stop offset="1" stop-color="#b85775"/>
    </linearGradient>
    <linearGradient id="mintFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7bc8b5"/>
      <stop offset="1" stop-color="#5fb19c"/>
    </linearGradient>
    <linearGradient id="peachFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8a87c"/>
      <stop offset="1" stop-color="#d48c5a"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#3a1c28" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Cream background -->
  <rect width="1280" height="720" fill="url(#cream)"/>

  <!-- Soft candy blobs -->
  <circle cx="160" cy="120" r="180" fill="#9b7bb8" opacity="0.12" filter="url(#soft)"/>
  <circle cx="1140" cy="600" r="220" fill="#d4738c" opacity="0.18" filter="url(#soft)"/>
  <circle cx="1100" cy="120" r="120" fill="#c8a062" opacity="0.18" filter="url(#soft)"/>

  <!-- Suite chip top-left -->
  <g transform="translate(48,44)">
    <rect width="280" height="44" rx="22" fill="#9b7bb8"/>
    <text x="22" y="29" font-family="JetBrains Mono, monospace" font-size="15" font-weight="500" fill="#faf7f2" letter-spacing="2">LOGISTICS · SUITE · 01</text>
  </g>

  <!-- Right-side device card showing the rate flip -->
  <g transform="translate(760,108)" filter="url(#cardShadow)">
    <rect width="468" height="504" rx="24" fill="#ffffff"/>
    <!-- Card header -->
    <rect x="0" y="0" width="468" height="68" rx="24" fill="url(#pinkFill)"/>
    <rect x="0" y="44" width="468" height="24" fill="url(#pinkFill)"/>
    <text x="28" y="44" font-family="DM Sans, sans-serif" font-weight="800" font-size="22" fill="#faf7f2">Bulk Export · Today</text>
    <circle cx="430" cy="34" r="9" fill="#faf7f2" opacity="0.6"/>
    <circle cx="406" cy="34" r="9" fill="#faf7f2" opacity="0.4"/>
    <circle cx="382" cy="34" r="9" fill="#faf7f2" opacity="0.4"/>

    <!-- Table head -->
    <text x="28" y="106" font-family="JetBrains Mono, monospace" font-size="13" fill="#8a6577" letter-spacing="1">LANE          EQUIP   DAT      NEW</text>

    <!-- Rows — varied deltas per QA P1-5 -->
    <g font-family="DM Sans, sans-serif" font-size="18" fill="#2a1a22">
      <rect x="20" y="118" width="428" height="44" rx="10" fill="#faf7f2"/>
      <text x="32" y="146">MSP → CHI</text>
      <text x="200" y="146" fill="#7a6b50">VR</text>
      <text x="262" y="146" fill="#8a6577">$1,950</text>
      <text x="362" y="146" font-weight="800" fill="#5fb19c">$1,800</text>

      <rect x="20" y="170" width="428" height="44" rx="10" fill="#faf7f2"/>
      <text x="32" y="198">DAL → ATL</text>
      <text x="200" y="198" fill="#7a6b50">V</text>
      <text x="262" y="198" fill="#8a6577">$2,425</text>
      <text x="362" y="198" font-weight="800" fill="#5fb19c">$2,300</text>

      <rect x="20" y="222" width="428" height="44" rx="10" fill="#faf7f2"/>
      <text x="32" y="250">LAX → PHX</text>
      <text x="200" y="250" fill="#7a6b50">R</text>
      <text x="262" y="250" fill="#8a6577">$1,440</text>
      <text x="362" y="250" font-weight="800" fill="#5fb19c">$1,250</text>

      <rect x="20" y="274" width="428" height="44" rx="10" fill="#faf7f2"/>
      <text x="32" y="302">CLE → BOS</text>
      <text x="200" y="302" fill="#7a6b50">F</text>
      <text x="262" y="302" fill="#8a6577">$1,795</text>
      <text x="362" y="302" font-weight="800" fill="#5fb19c">$1,700</text>
    </g>

    <!-- Bottom action row -->
    <rect x="20" y="336" width="428" height="60" rx="14" fill="#7bc8b5"/>
    <text x="44" y="374" font-family="DM Sans, sans-serif" font-weight="800" font-size="22" fill="#1f3b34">💰 Posted Amount → Revenova</text>

    <!-- Counter chip -->
    <g transform="translate(20,414)">
      <rect width="200" height="68" rx="14" fill="#9b7bb8"/>
      <text x="20" y="32" font-family="JetBrains Mono, monospace" font-size="12" fill="#faf7f2" letter-spacing="2" opacity="0.85">LOADS POSTED</text>
      <text x="20" y="58" font-family="DM Sans, sans-serif" font-weight="800" font-size="26" fill="#faf7f2">50 · today</text>
    </g>
    <g transform="translate(232,414)">
      <rect width="216" height="68" rx="14" fill="#c8a062"/>
      <text x="20" y="32" font-family="JetBrains Mono, monospace" font-size="12" fill="#2a1a22" letter-spacing="2" opacity="0.8">TIME SAVED</text>
      <text x="20" y="58" font-family="DM Sans, sans-serif" font-weight="800" font-size="26" fill="#2a1a22">55 min</text>
    </g>
  </g>

  <!-- Left-side title block -->
  <g transform="translate(48,160)">
    <!-- Eyebrow -->
    <text font-family="JetBrains Mono, monospace" font-size="22" fill="#9b7bb8" letter-spacing="4" font-weight="500">EP · 01  ·  MASS POST</text>

    <!-- Headline (3-line, big) -->
    <text y="86" font-family="DM Sans, sans-serif" font-weight="800" font-size="116" fill="#2a1a22" letter-spacing="-3">50 LOADS.</text>
    <text y="200" font-family="DM Sans, sans-serif" font-weight="800" font-size="116" fill="url(#pinkFill)" letter-spacing="-3">5 MINUTES.</text>
    <text y="314" font-family="DM Sans, sans-serif" font-weight="800" font-size="62" fill="#2a1a22" letter-spacing="-1">No retyping.</text>

    <!-- Sub -->
    <g transform="translate(0,360)">
      <rect width="660" height="60" rx="30" fill="#2a1a22"/>
      <text x="32" y="40" font-family="DM Sans, sans-serif" font-weight="700" font-size="22" fill="#faf7f2">DAT ⇄ Revenova · the broker's roundtrip</text>
    </g>

    <!-- Tagline -->
    <text y="468" font-family="JetBrains Mono, monospace" font-size="18" fill="#8a6577" letter-spacing="3">BUILT  BY  BROKERS  ·  FOR  BROKERS</text>
  </g>
</svg>

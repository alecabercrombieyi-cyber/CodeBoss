<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf7f2"/>
      <stop offset="100%" stop-color="#f3e3e9"/>
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4738c"/>
      <stop offset="100%" stop-color="#b85775"/>
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#7bc8b5" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#9b7bb8" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="sparkle" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Diagonal candy stripe -->
  <polygon points="0,540 1280,360 1280,420 0,600" fill="#e8a87c" opacity="0.18"/>
  <polygon points="0,580 1280,400 1280,440 0,620" fill="#c8a062" opacity="0.22"/>

  <!-- LEFT: "Before" data block (sensitive — pink crosshatch) -->
  <g transform="translate(80, 200)">
    <rect width="380" height="340" rx="18" fill="#ffffff" stroke="#d4738c" stroke-width="3" filter="url(#softShadow)"/>
    <rect width="380" height="48" rx="18" fill="url(#pinkGrad)"/>
    <rect y="36" width="380" height="12" fill="url(#pinkGrad)"/>
    <text x="20" y="32" font-family="DM Sans, sans-serif" font-size="20" font-weight="700" fill="#ffffff">REAL DATA — SENSITIVE</text>
    <!-- "Sensitive" rows: blurred-looking text -->
    <g font-family="JetBrains Mono, monospace" font-size="18" fill="#7a3548">
      <text x="20" y="86">Alice Johnson</text>
      <text x="20" y="120">alice.j@company.com</text>
      <text x="20" y="154">555-123-4567</text>
      <text x="20" y="188" font-weight="700">SSN: 123-45-6789</text>
      <text x="20" y="222">$85,000 / Engineering</text>
      <text x="20" y="256">Portland, OR</text>
      <text x="20" y="290">Hired 2019-03-15</text>
    </g>
    <!-- Pink redaction strip over SSN -->
    <rect x="80" y="170" width="220" height="26" fill="#b85775" opacity="0.92" rx="3"/>
    <text x="190" y="190" font-family="DM Sans, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">SSN HIDDEN</text>
    <text x="190" y="328" font-family="DM Sans, sans-serif" font-size="14" fill="#b85775" text-anchor="middle" font-style="italic">do NOT send this</text>
  </g>

  <!-- CENTER: Soap bubble + arrow + sparkles -->
  <g transform="translate(640, 380)">
    <!-- Big bubble -->
    <circle r="125" fill="url(#bubbleGrad)" stroke="#9b7bb8" stroke-width="3" opacity="0.92"/>
    <!-- Bubble highlight -->
    <ellipse cx="-38" cy="-50" rx="32" ry="22" fill="#ffffff" opacity="0.55"/>
    <ellipse cx="-50" cy="-65" rx="10" ry="6" fill="#ffffff" opacity="0.85"/>
    <!-- Smaller floating bubbles -->
    <circle cx="-150" cy="-90" r="22" fill="url(#bubbleGrad)" stroke="#7bc8b5" stroke-width="2" opacity="0.8"/>
    <circle cx="135" cy="-110" r="16" fill="url(#bubbleGrad)" stroke="#7bc8b5" stroke-width="2" opacity="0.75"/>
    <circle cx="150" cy="80" r="28" fill="url(#bubbleGrad)" stroke="#9b7bb8" stroke-width="2" opacity="0.8"/>
    <circle cx="-145" cy="95" r="14" fill="url(#bubbleGrad)" stroke="#7bc8b5" stroke-width="2" opacity="0.75"/>

    <!-- Sparkles inside the big bubble -->
    <g opacity="0.95">
      <circle cx="0" cy="0" r="40" fill="url(#sparkle)"/>
      <path d="M0,-32 L4,-4 L32,0 L4,4 L0,32 L-4,4 L-32,0 L-4,-4 Z" fill="#ffffff"/>
      <path d="M40,-20 L42,-12 L50,-10 L42,-8 L40,0 L38,-8 L30,-10 L38,-12 Z" fill="#ffffff" opacity="0.9"/>
      <path d="M-45,25 L-43,33 L-35,35 L-43,37 L-45,45 L-47,37 L-55,35 L-47,33 Z" fill="#ffffff" opacity="0.9"/>
    </g>
  </g>

  <!-- Arrow between blocks -->
  <g transform="translate(495, 370)">
    <path d="M0,0 L70,0 L70,-12 L100,8 L70,28 L70,16 L0,16 Z" fill="#9b7bb8"/>
  </g>
  <g transform="translate(715, 370)">
    <path d="M0,0 L70,0 L70,-12 L100,8 L70,28 L70,16 L0,16 Z" fill="#7bc8b5"/>
  </g>

  <!-- RIGHT: "After" data block (clean — mint) -->
  <g transform="translate(820, 200)">
    <rect width="380" height="340" rx="18" fill="#ffffff" stroke="#7bc8b5" stroke-width="3" filter="url(#softShadow)"/>
    <rect width="380" height="48" rx="18" fill="#7bc8b5"/>
    <rect y="36" width="380" height="12" fill="#7bc8b5"/>
    <text x="20" y="32" font-family="DM Sans, sans-serif" font-size="20" font-weight="700" fill="#1a3d36">SYNTHETIC — SHARE FREELY</text>
    <g font-family="JetBrains Mono, monospace" font-size="18" fill="#2a5a4d">
      <text x="20" y="86">Phoenix Tanaka</text>
      <text x="20" y="120">phoenix_tanaka42@datamail.net</text>
      <text x="20" y="154">444-829-3014</text>
      <text x="20" y="188" font-weight="700">SSN: [REDACTED]</text>
      <text x="20" y="222">$78,420 / Engineering</text>
      <text x="20" y="256">Crestwood, CA</text>
      <text x="20" y="290">Hired 1987-08-04</text>
    </g>
    <text x="190" y="328" font-family="DM Sans, sans-serif" font-size="14" fill="#2a5a4d" text-anchor="middle" font-style="italic">vendor-safe ✓</text>
  </g>

  <!-- TOP banner / app tag -->
  <g transform="translate(640, 70)">
    <rect x="-170" y="-30" width="340" height="60" rx="30" fill="#b85775"/>
    <text x="0" y="6" font-family="DM Sans, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">DATA WASH</text>
    <text x="0" y="26" font-family="JetBrains Mono, monospace" font-size="11" fill="#faf7f2" text-anchor="middle">LOGISTICS SUITE · APP 06</text>
  </g>

  <!-- BOTTOM value claim -->
  <g transform="translate(640, 640)">
    <text x="0" y="0" font-family="DM Sans, sans-serif" font-size="52" font-weight="900" fill="#1a1a2e" text-anchor="middle">Hide PII in 2 minutes.</text>
    <text x="0" y="38" font-family="JetBrains Mono, monospace" font-size="20" fill="#b85775" text-anchor="middle">no upload · no signup · free</text>
  </g>
</svg>
</content>
</invoke>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Background: cream wash with soft pink gradient -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf7f2"/>
      <stop offset="1" stop-color="#f3e6e2"/>
    </linearGradient>
    <linearGradient id="shieldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4738c"/>
      <stop offset="1" stop-color="#b85775"/>
    </linearGradient>
    <linearGradient id="redBanner" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c26a6a"/>
      <stop offset="1" stop-color="#9a4747"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1a1a1a" flood-opacity="0.18"/>
    </filter>
    <filter id="stampShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1a1a1a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Top-left mono chapter / brand mark -->
  <text x="60" y="80" font-family="JetBrains Mono, monospace" font-size="22" fill="#9b7bb8" letter-spacing="4" font-weight="500">LOGISTICS SUITE · 05 / 07</text>

  <!-- ── LEFT BLOCK: SHIELD WITH CHECKMARK ── -->
  <g transform="translate(120,180)" filter="url(#softShadow)">
    <!-- Shield silhouette -->
    <path d="M170 0 L340 60 L340 220 Q340 350 170 420 Q0 350 0 220 L0 60 Z"
          fill="url(#shieldFill)" stroke="#7d3a55" stroke-width="6"/>
    <!-- Inner cream inset -->
    <path d="M170 30 L312 80 L312 215 Q312 325 170 385 Q28 325 28 215 L28 80 Z"
          fill="#faf7f2" opacity="0.94"/>
    <!-- Checkmark -->
    <path d="M85 215 L155 285 L260 145"
          fill="none" stroke="#7bc8b5" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Mono "MC #" tag -->
    <rect x="100" y="350" width="140" height="34" rx="6" fill="#9b7bb8"/>
    <text x="170" y="373" font-family="JetBrains Mono, monospace" font-size="18" fill="#faf7f2" font-weight="600" text-anchor="middle">MC# 1234567</text>
  </g>

  <!-- ── RIGHT BLOCK: HEADLINE STACK ── -->
  <g transform="translate(540,170)">
    <!-- Eyebrow -->
    <text x="0" y="0" font-family="JetBrains Mono, monospace" font-size="20" fill="#b85775" letter-spacing="6" font-weight="600">CARRIERVET</text>

    <!-- Headline -->
    <text x="0" y="80" font-family="DM Sans, sans-serif" font-size="92" font-weight="700" fill="#2a1820" letter-spacing="-3">VET A CARRIER</text>
    <text x="0" y="180" font-family="DM Sans, sans-serif" font-size="92" font-weight="700" fill="#2a1820" letter-spacing="-3">IN 10 SECONDS</text>

    <!-- Pink accent underline -->
    <rect x="0" y="206" width="280" height="10" rx="5" fill="#d4738c"/>

    <!-- Sub-headline -->
    <text x="0" y="270" font-family="DM Sans, sans-serif" font-size="32" font-weight="500" fill="#5a3445">Stop getting double-brokered.</text>
  </g>

  <!-- ── BOTTOM-RIGHT RED "BLOCKED" STAMP (tension element) ── -->
  <g transform="translate(960,500) rotate(-8)" filter="url(#stampShadow)">
    <rect x="-130" y="-44" width="260" height="88" rx="8" fill="url(#redBanner)" stroke="#722929" stroke-width="3"/>
    <text x="0" y="6" font-family="DM Sans, sans-serif" font-size="36" font-weight="700" fill="#faf7f2" text-anchor="middle" letter-spacing="3">BLOCKED</text>
    <text x="0" y="32" font-family="JetBrains Mono, monospace" font-size="13" fill="#faf7f2" text-anchor="middle" letter-spacing="2" opacity="0.85">FACTORING FLAG</text>
  </g>

  <!-- ── BOTTOM-LEFT TAGLINE ── -->
  <g transform="translate(120,650)">
    <circle cx="0" cy="0" r="8" fill="#c8a062"/>
    <text x="20" y="6" font-family="JetBrains Mono, monospace" font-size="18" fill="#5a3445" font-weight="500" letter-spacing="2">BUILT BY BROKERS · FOR BROKERS</text>
  </g>

  <!-- Suite candy chip cluster (top-right corner) -->
  <g transform="translate(1100,60)">
    <circle cx="0" cy="0" r="14" fill="#d4738c"/>
    <circle cx="32" cy="0" r="14" fill="#7bc8b5"/>
    <circle cx="64" cy="0" r="14" fill="#e8a87c"/>
    <circle cx="96" cy="0" r="14" fill="#c8a062" stroke="#9b7bb8" stroke-width="3"/>
    <text x="96" y="5" font-family="DM Sans, sans-serif" font-size="14" font-weight="700" fill="#3a2530" text-anchor="middle">5</text>
  </g>
</svg>

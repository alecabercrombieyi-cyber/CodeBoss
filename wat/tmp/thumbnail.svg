<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdfaf4"/>
      <stop offset="55%" stop-color="#fde7ef"/>
      <stop offset="100%" stop-color="#f0e6f9"/>
    </linearGradient>
    <linearGradient id="pinkBtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e599ad"/>
      <stop offset="50%" stop-color="#d4738c"/>
      <stop offset="100%" stop-color="#b85775"/>
    </linearGradient>
    <linearGradient id="cardA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fdf2f6"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6" result="off"/>
      <feMerge><feMergeNode in="off"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Soft pink halo bottom-left -->
  <circle cx="200" cy="640" r="280" fill="#f0d0dc" opacity="0.5" filter="url(#soft)"/>
  <circle cx="1100" cy="120" r="220" fill="#c9a0d9" opacity="0.32" filter="url(#soft)"/>

  <!-- Sugar-dust dots -->
  <g fill="#d4738c" opacity="0.18">
    <circle cx="120" cy="160" r="3"/>
    <circle cx="260" cy="80" r="2"/>
    <circle cx="950" cy="640" r="3"/>
    <circle cx="1180" cy="540" r="2.5"/>
    <circle cx="80" cy="380" r="2"/>
    <circle cx="1220" cy="280" r="2"/>
  </g>

  <!-- EP 03 mono stamp -->
  <g transform="translate(72,72)">
    <rect x="0" y="0" width="118" height="32" rx="16" fill="#ffffff" stroke="#f0d0dc" stroke-width="1"/>
    <text x="59" y="22" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="600" fill="#d4738c" text-anchor="middle" letter-spacing="2">EP 03 · SUITE</text>
  </g>

  <!-- Kicker -->
  <text x="72" y="170" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" font-weight="500" fill="#9b7bb8" letter-spacing="3.5">LOGISTICS · SUITE · TUTORIAL</text>

  <!-- Headline -->
  <text x="72" y="260" font-family="DM Sans, sans-serif" font-size="84" font-weight="800" fill="#2c2823" letter-spacing="-3.5">Triage 30</text>
  <text x="72" y="350" font-family="DM Sans, sans-serif" font-size="84" font-weight="800" fill="#2c2823" letter-spacing="-3.5">loads in <tspan fill="#d4738c" font-style="italic">10 min</tspan></text>

  <!-- Subhead -->
  <text x="72" y="410" font-family="DM Sans, sans-serif" font-size="22" font-weight="500" fill="#56514c" letter-spacing="-0.4">Load Manager — one HTML file, your morning solved</text>

  <!-- CTA pill -->
  <g transform="translate(72,450)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="252" height="58" rx="29" fill="url(#pinkBtn)"/>
    <text x="126" y="37" font-family="DM Sans, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="-0.2">Built by brokers · for brokers</text>
  </g>

  <!-- Load cards stack (right side hero) -->
  <g transform="translate(720,140)" filter="url(#cardShadow)">
    <!-- Card 1 (back) -->
    <g transform="translate(40,0) rotate(2)">
      <rect x="0" y="0" width="440" height="118" rx="18" fill="url(#cardA)" stroke="#f0d0dc"/>
      <rect x="0" y="0" width="5" height="118" rx="2" fill="#7bc8b5"/>
      <text x="22" y="36" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#4e9b85">LOAD #2535291</text>
      <text x="22" y="62" font-family="DM Sans, sans-serif" font-size="18" font-weight="700" fill="#2c2823">CH Robinson · ATL → CHI</text>
      <text x="22" y="86" font-family="DM Sans, sans-serif" font-size="13" fill="#8a857e">VR · ship 5/17 · driver Mike H.</text>
      <g transform="translate(22,96)">
        <rect width="56" height="18" rx="9" fill="#eef9f5" stroke="#c0e8dc"/>
        <text x="28" y="13" font-family="DM Sans" font-size="10" font-weight="700" fill="#4e9b85" text-anchor="middle">G2G</text>
      </g>
    </g>
    <!-- Card 2 (middle) -->
    <g transform="translate(0,90)">
      <rect x="0" y="0" width="460" height="124" rx="18" fill="#ffffff" stroke="#f0d0dc"/>
      <rect x="0" y="0" width="5" height="124" rx="2" fill="#d4738c"/>
      <text x="22" y="38" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#b85775">LOAD #2535422</text>
      <text x="22" y="64" font-family="DM Sans, sans-serif" font-size="19" font-weight="700" fill="#2c2823">Werner · DAL → MEM</text>
      <text x="22" y="88" font-family="DM Sans, sans-serif" font-size="13" fill="#8a857e">R · ship today · </text>
      <text x="118" y="88" font-family="DM Sans, sans-serif" font-size="13" font-weight="700" fill="#b85775">Needs Driver</text>
      <g transform="translate(22,100)">
        <rect width="98" height="18" rx="9" fill="#fdf2f6" stroke="#f0d0dc"/>
        <text x="49" y="13" font-family="DM Sans" font-size="10" font-weight="700" fill="#b85775" text-anchor="middle">In Depth · G2G</text>
      </g>
    </g>
    <!-- Card 3 (front, late) -->
    <g transform="translate(64,200) rotate(-2)">
      <rect x="0" y="0" width="430" height="118" rx="18" fill="#ffffff" stroke="#f3c79c"/>
      <rect x="0" y="0" width="5" height="118" rx="2" fill="#e8a87c"/>
      <text x="22" y="36" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#c8804f">LOAD #2535588</text>
      <text x="22" y="62" font-family="DM Sans, sans-serif" font-size="18" font-weight="700" fill="#2c2823">Schneider · PHX → LAX</text>
      <text x="22" y="86" font-family="DM Sans, sans-serif" font-size="13" fill="#8a857e">FH · on site 1h47m</text>
      <g transform="translate(22,96)">
        <rect width="84" height="18" rx="9" fill="#fff3e6" stroke="#f3c79c"/>
        <text x="42" y="13" font-family="DM Sans" font-size="10" font-weight="700" fill="#c8804f" text-anchor="middle">On Site</text>
      </g>
    </g>
  </g>

  <!-- Bottom-right brand mark -->
  <g transform="translate(1080,640)">
    <circle cx="0" cy="0" r="22" fill="#d4738c"/>
    <path d="M0,-12 c6,0 10,4 10,10 c0,5 -3,9 -7,10 h-6 c-4,-1 -7,-5 -7,-10 c0,-6 4,-10 10,-10z" fill="#ffffff"/>
    <rect x="-1.5" y="3" width="3" height="7" rx="1.2" fill="#ffffff" opacity="0.85"/>
    <text x="34" y="6" font-family="DM Sans, sans-serif" font-size="18" font-weight="700" fill="#2c2823" letter-spacing="-0.3">Logistics<tspan fill="#d4738c" font-style="italic" font-weight="600"> Suite</tspan></text>
  </g>
</svg>
